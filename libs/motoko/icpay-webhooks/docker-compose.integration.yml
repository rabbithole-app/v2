# Integration testing compose: replica + nginx proxy + cloudflared tunnel
# for testing webhooks from external ICPay service.
#
# Usage: docker compose -f docker-compose.integration.yml up
# Requires: ICPAY_SECRET_KEY in environment or .env file

name: icpay-webhooks-integration

services:
  replica:
    build:
      context: ../../../infra/motoko-dev
    platform: linux/arm64
    working_dir: /app
    tty: true
    stdin_open: true
    ports:
      - 4943
    volumes:
      - ./:/app:rw
      - ../../../mops-patches:/mops-patches:ro
      - nginx_config:/nginx-config:rw
      - mops_cache:/app/.mops
      - dfx_state:/app/.dfx
    environment:
      - ICPAY_SECRET_KEY=${ICPAY_SECRET_KEY:?ICPAY_SECRET_KEY is not set}
    healthcheck:
      test: ['CMD', 'dfx', 'ping']
      interval: 15s
      timeout: 30s
      retries: 40
      start_period: 60s
    command: ['bash', '-lc', 'bash ./infra/integration-entrypoint.sh']

  proxy:
    image: nginx:alpine
    volumes:
      - nginx_config:/etc/nginx/conf.d:ro
    depends_on:
      replica:
        condition: service_healthy
    command: >
      sh -c '
        echo "Waiting for nginx config..."
        while [ ! -f /etc/nginx/conf.d/.ready ]; do sleep 2; done
        echo "Config ready, starting nginx"
        nginx -g "daemon off;"
      '

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://proxy:80 --protocol http2
    depends_on:
      - proxy

volumes:
  nginx_config:
  mops_cache:
  dfx_state:
