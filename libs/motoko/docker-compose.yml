name: motoko-libs

services:
  replica:
    build:
      context: ../../infra/motoko-dev
    platform: linux/arm64
    working_dir: /workspace
    tty: true
    stdin_open: true
    ports:
      - '4943:4943'
    volumes:
      - ./:/workspace/libs:rw
      - ../../mops-patches:/mops-patches:ro
    healthcheck:
      test: ['CMD', 'dfx', 'ping']
      interval: 10s
      timeout: 30s
      retries: 12
    command: ['bash', '-lc', 'bash /workspace/libs/docker-entrypoint.sh']
