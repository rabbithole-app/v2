networks:
  - networks/local.yaml

environments:
  - name: local
    network: local
    canisters:
      - encrypted-storage

canisters:
  - name: encrypted-storage
    recipe:
      type: "@dfinity/motoko@v4.1.0"
      configuration:
        main: src/EncryptedStorageCanister.mo
        args: --max-stable-pages 3276800
        compress: true
