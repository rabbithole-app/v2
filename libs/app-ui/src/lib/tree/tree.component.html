<cdk-tree
  #tree
  class="flex flex-col"
  [dataSource]="data()"
  [childrenAccessor]="childrenAccessor"
  [trackBy]="trackBy"
  [expansionKey]="expansionKey"
>
  <cdk-tree-node
    *cdkTreeNodeDef="let node"
    rbthTreeItem
    [cdkTreeNodeTypeaheadLabel]="node.name"
    [isDisabled]="!shouldRender(node) || !isSelectable(node)"
    (click)="select(node)"
  >
    <span rbthTreeItemLabel
      ><ng-icon
        class="text-muted-foreground pointer-events-none"
        hlm
        size="sm"
        [name]="isFolder(node) ? 'lucideFolder' : 'lucideFile'"
      />{{ node.name }}</span
    >
  </cdk-tree-node>
  <cdk-tree-node
    *cdkTreeNodeDef="let node; when: hasChild"
    rbthTreeItem
    [cdkTreeNodeTypeaheadLabel]="node.name"
    [isDisabled]="!shouldRender(node) || !isSelectable(node)"
    [isExpandable]="true"
    (expandedChange)="rememberExpansionState()"
    (click)="select(node)"
  >
    <span rbthTreeItemLabel>
      <button
        type="button"
        class="flex items-center"
        cdkTreeNodeToggle
        [attr.aria-label]="'Toggle ' + node.name"
        (click)="$event.stopPropagation()"
      >
        <ng-icon
          class="text-muted-foreground in-aria-[expanded=false]:-rotate-90"
          hlm
          size="sm"
          name="lucideChevronDown"
        />
      </button>
      <span class="flex items-center gap-2">
        @let iconName =
          tree.isExpanded(node) ? 'lucideFolderOpen' : 'lucideFolder';
        <ng-icon
          class="text-muted-foreground pointer-events-none"
          hlm
          size="sm"
          [name]="iconName"
        />
        {{ node.name }}
      </span></span
    >
  </cdk-tree-node>
</cdk-tree>
