    <hlm-avatar class="size-9 shrink-0 border bg-muted text-xs">
      @if (avatarSrc(); as src) {
        <img hlmAvatarImage [src]="src" [alt]="title()" />
      }
      <img hlmAvatarFallback src="/avatar-placeholder.svg" [alt]="title()" />
    </hlm-avatar>

    <div class="min-w-0 flex-1">
      <div class="flex min-w-0 items-center gap-1.5">
        <div class="truncate font-medium">
          <span>{{ title() }}</span>
          @if (username(); as value) {
            <span class="text-muted-foreground"> · @{{ value }}</span>
          }
        </div>
        <ng-content select="[rbthUserIdentityTitleMeta]" />
      </div>

      @if (!username() && email(); as value) {
        <div class="truncate text-xs text-muted-foreground">
          {{ value }}
        </div>
      }

      @if (principalId(); as value) {
        @if (copyPrincipal()) {
          <rbth-copy-to-clipboard class="text-muted-foreground" [content]="value">
            {{ value }}
          </rbth-copy-to-clipboard>
        } @else {
          <div class="truncate font-mono text-xs text-muted-foreground">
            {{ value }}
          </div>
        }
      }
    </div>
