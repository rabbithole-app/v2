<ul hlmSidebarMenu>
  @for (item of data(); track item.title) {
    <li hlmSidebarMenuItem>
      <a
        rbthSidebarMenuButton
        [isActive]="rla.isActive"
        [routerLink]="item.url"
        routerLinkActive
        #rla="routerLinkActive"
        [hlmTooltip]="item.title"
        [tooltipDisabled]="tooltipDisabled()"
        position="right"
        [routerLinkActiveOptions]="{ exact: item.url === exact() }"
      >
        <ng-icon size="sm" hlmIcon [name]="item.icon" hlmMenuIcon />
        <span class="min-w-0 flex-1 truncate">{{ item.title }}</span>
        @if (item.badgeCount && item.badgeCount > 0) {
          <span hlmBadge variant="outline" class="ml-auto min-w-5 px-1">
            {{ item.badgeCount }}
          </span>
        }
      </a>
    </li>
  }
</ul>
