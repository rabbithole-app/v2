<hlm-sidebar collapsible="icon">
  <core-sidebar-header />
  <div hlmSidebarContent class="gap-0">
    <ng-content select="[sidebarTop]" />
    <router-outlet name="sidebar" />
    <div hlmSidebarGroup>
      <div hlmSidebarGroupLabel>Resources</div>
      <div hlmSidebarGroupContent>
        <ul hlmSidebarMenu>
          <li hlmSidebarMenuItem>
            <a
              rbthSidebarMenuButton
              [hlmTooltip]="'Docs'"
              [tooltipDisabled]="tooltipDisabled()"
              position="right"
              href="https://docs.rabbithole.app"
              target="_blank"
              rel="noopener"
            >
              <ng-icon hlmIcon name="lucideBookOpen" size="sm" hlmMenuIcon />
              <span>Docs</span>
            </a>
          </li>
          <li hlmSidebarMenuItem>
            <a
              rbthSidebarMenuButton
              [hlmTooltip]="'GitHub'"
              [tooltipDisabled]="tooltipDisabled()"
              position="right"
              href="https://github.com/rabbithole-app/v2"
              target="_blank"
              rel="noopener"
            >
              <ng-icon hlmIcon name="lucideGithub" size="sm" hlmMenuIcon />
              <span>GitHub</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
  <div hlmSidebarFooter>
    @defer (on idle) {
      <rbth-sidebar-subscription-footer />
    } @placeholder {
      <div class="flex items-center gap-2 rounded-md px-2 py-1.5 text-sm text-muted-foreground">
        <span class="group-data-[collapsible=icon]:hidden truncate">Loading account</span>
      </div>
    }
  </div>
  <button hlmSidebarRail></button>
</hlm-sidebar>
<main hlmSidebarInset class="min-w-0 overflow-hidden">
  <rbth-expired-banner />
  <router-outlet name="banner" />
  <div class="flex min-w-0 flex-1 flex-col">
    <header class="bg-card sticky top-0 z-50 border-b">
      <div class="flex items-center justify-between gap-6 p-2 sm:px-4">
        <div class="flex items-center gap-4">
          <button hlmSidebarTrigger class="-ml-1"></button>
          <hlm-separator
            orientation="vertical"
            class="mr-2 data-[orientation=vertical]:h-4"
          />
          <router-outlet name="header" />
        </div>
        <rbth-notification-bell />
        <core-account-menu class="self-end" />
      </div>
    </header>
    <div class="flex min-w-0 flex-1 flex-col px-4 py-6 sm:px-6">
      <ng-content />
    </div>
    <footer></footer>
  </div>
</main>
