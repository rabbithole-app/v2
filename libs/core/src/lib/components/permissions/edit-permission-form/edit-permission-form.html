<hlm-dialog>
  <ng-content />
  <hlm-dialog-content
    class="sm:max-w-[425px] w-[600px]!"
    *brnDialogContent="let ctx"
  >
    <hlm-dialog-header>
      @let title = isEditMode() ? 'Edit permission' : 'Add permission';
      <h3 hlmDialogTitle>{{ title }}</h3>
      <p hlmDialogDescription></p>
    </hlm-dialog-header>
    <form class="space-y-5" [formGroup]="form">
      <div class="space-y-2">
        <label hlmLabel for="user">User</label>
        @if (isEditMode()) {
          <input
            hlmInput
            id="user"
            formControlName="user"
            [attr.aria-invalid]="userControl.invalid"
            class="font-mono text-sm"
          />
        } @else {
          <core-user-target-combobox
            class="block w-full"
            [allowTypedEmail]="false"
            placeholder="Search user or principal"
            [value]="selectedUsers()"
            (valueChange)="handleUsersChange($event)"
          />
        }
      </div>

      <div class="space-y-2">
        <label hlmLabel>Permission</label>
        <hlm-select
          placeholder="Select a permission"
          formControlName="permission"
        >
          <hlm-select-trigger class="w-full">
            <hlm-select-value />
          </hlm-select-trigger>
          <hlm-select-content *hlmSelectPortal class="w-64 min-w-48">
            @for (option of permissions; track option.value) {
              <hlm-select-item
                [value]="option.value"
                class="flex flex-col items-start gap-0 justify-center"
              >
                <span>{{ option.label }}</span>
                <span class="text-muted-foreground text-xs">{{
                  option.description
                }}</span>
              </hlm-select-item>
            }
          </hlm-select-content>
        </hlm-select>
      </div>
    </form>
    <hlm-dialog-footer>
      <button
        hlmBtn
        type="button"
        [disabled]="form.invalid"
        (click)="handleSubmit()"
      >
        @if (isEditMode()) {
          Save
        } @else {
          Add
        }
      </button>
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>
