    @if (canEdit) {
      <core-edit-permission-form
        [principal]="principal"
        [permission]="permission"
        (accessGrantsChange)="edit.emit($event)"
      >
        <button
          class="size-8"
          variant="ghost"
          size="icon"
          hlmTooltip="Edit permission"
          coreEditPermissionFormTrigger
        >
          <ng-icon hlmIcon name="lucideUserPen" size="sm" />
          <span class="sr-only">Edit</span>
        </button>
      </core-edit-permission-form>
    }
    <hlm-alert-dialog>
      <button
        class="size-8 text-destructive hover:text-destructive"
        hlmBtn
        variant="ghost"
        size="icon"
        hlmTooltip="Revoke permission"
        brnAlertDialogTrigger
      >
        <span class="sr-only">Revoke</span>
        <ng-icon hlmIcon size="sm" name="lucideTrash2" />
      </button>
      <hlm-alert-dialog-content *brnAlertDialogContent="let ctx">
        <hlm-alert-dialog-header>
          <h3 hlmAlertDialogTitle>Are you absolutely sure?</h3>
          <p hlmAlertDialogDescription>
            @if (isPending) {
              This will cancel the pending invite before it is claimed.
            } @else if (isClaimedEmailInvite) {
              This will revoke access claimed from this email invite.
            } @else {
              This will remove this target's access for the selected scope.
            }
          </p>
        </hlm-alert-dialog-header>
        <hlm-alert-dialog-footer>
          <button hlmAlertDialogCancel (click)="ctx.close()">Cancel</button>
          <button hlmAlertDialogAction (click)="handleRevoke()">
            @if (isPending) {
              Cancel invite
            } @else {
              Revoke permission
            }
          </button>
        </hlm-alert-dialog-footer>
      </hlm-alert-dialog-content>
    </hlm-alert-dialog>
