<div
  class="group relative"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
>
  <hlm-avatar
    class="size-[140px] transition-all duration-500 ease-in-out group-hover:grayscale"
  >
    <img
      hlmAvatarImage
      [src]="avatarSrc()"
      alt="Avatar"
      class="transition-all duration-500 ease-in-out"
    />
    <img
      hlmAvatarFallback
      src="/avatar-placeholder.svg"
      alt="Avatar placeholder"
      class="transition-all duration-500 ease-in-out"
    />
  </hlm-avatar>

  <!-- Dimming overlay layer -->
  <div [class]="scrimClass()"></div>

  <!-- Layer for action buttons -->
  <div
    [class]="controlsLayerClass()"
    aria-live="polite"
    [attr.aria-busy]="saving()"
  >
    @if (saving()) {
      <button
        hlmBtn
        type="button"
        size="icon"
        variant="secondary"
        class="size-8 cursor-default"
        disabled
        aria-label="Saving avatar"
      >
        <hlm-spinner />
      </button>
    } @else if (showControls()) {
      <button
        hlmBtn
        type="button"
        size="icon"
        variant="secondary"
        class="size-8"
        [disabled]="disabledState()"
        [hlmTooltip]="'Edit'"
        [style.animation]="
          showControls() ? 'bounce-in 0.6s ease-out 0.1s both' : 'none'
        "
        (click)="handleEdit()"
      >
        <ng-icon hlm size="sm" name="lucidePencil" />
      </button>

      @if (hasValue()) {
        <button
          hlmBtn
          type="button"
          size="icon"
          variant="secondary"
          class="size-8 text-destructive hover:text-destructive"
          [disabled]="disabledState()"
          [hlmTooltip]="'Delete'"
          [style.animation]="
            showControls() ? 'bounce-in 0.6s ease-out 0.2s both' : 'none'
          "
          (click)="handleDelete()"
        >
          <ng-icon hlm size="sm" name="lucideTrash" />
        </button>
      }
    }
  </div>
</div>
