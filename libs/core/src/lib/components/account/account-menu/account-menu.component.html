@let p = profile();
@let principal = principalId();
@let userTitle = title();
@let userAvatarSrc = avatarSrc();
@let pro = isPro();
@let walletBalance = walletBalanceLabel();

<ul hlmSidebarMenu>
  <li hlmSidebarMenuItem>
    <button
      hlmSidebarMenuButton
      size="lg"
      [hlmDropdownMenuTrigger]="accountMenu"
      [side]="menuSide()"
      align="end"
      [tooltip]="userTitle"
      aria-label="Open account menu"
    >
      <hlm-avatar class="size-8 shrink-0 border bg-muted text-xs">
        @if (userAvatarSrc) {
          <img hlmAvatarImage [src]="userAvatarSrc" [alt]="userTitle" />
        }
        <img hlmAvatarFallback src="/avatar-placeholder.svg" [alt]="userTitle" />
      </hlm-avatar>
      @if (!iconOnlyTrigger()) {
        <div class="grid min-w-0 flex-1 gap-0.5 text-left text-sm leading-tight">
          <span class="flex min-w-0 items-center gap-1.5">
            <span class="truncate font-medium">{{ userTitle }}</span>
            @if (pro) {
              <span hlmBadge variant="secondary">
                <ng-icon
                  name="lucideStar"
                  color="var(--color-amber-500)"
                  aria-hidden="true"
                />
                Pro
              </span>
            }
          </span>
          <span class="truncate font-mono text-xs text-muted-foreground">
            {{ principal }}
          </span>
        </div>
        <ng-icon
          name="lucideChevronsUpDown"
          class="ml-auto text-base"
          aria-hidden="true"
        />
      }
    </button>
  </li>
</ul>

<ng-template #accountMenu>
  <hlm-dropdown-menu
    class="w-80 max-w-[calc(100vw-1rem)] rounded-lg"
    [class.ml-3]="iconOnlyTrigger()"
  >
    <hlm-dropdown-menu-label>
      <rbth-user-identity
        class="w-full pr-1"
        [avatarSrc]="userAvatarSrc"
        [copyPrincipal]="true"
        [principalId]="principalId()"
        [title]="userTitle"
        [username]="username()"
      >
        @if (pro) {
          <span
            rbthUserIdentityTitleMeta
            hlmBadge
            variant="secondary"
          >
            <ng-icon
              name="lucideStar"
              color="var(--color-amber-500)"
              aria-hidden="true"
            />
            Pro
          </span>
        }
      </rbth-user-identity>
    </hlm-dropdown-menu-label>
    @if (backendFeaturesEnabled) {
      <hlm-dropdown-menu-separator />
      <hlm-dropdown-menu-group>
        <button hlmDropdownMenuItem (triggered)="handleSubscriptionAction()">
          <ng-icon hlm [name]="subscriptionActionIcon()" />
          <span>{{ subscriptionActionLabel() }}</span>
        </button>
      </hlm-dropdown-menu-group>
      <hlm-dropdown-menu-separator />
      <hlm-dropdown-menu-group>
        <button hlmDropdownMenuItem (triggered)="openSettingsDialog()">
          <ng-icon hlm name="lucideSettings" />
          <span>Settings</span>
        </button>
        @if (backendLinksEnabled) {
          <button hlmDropdownMenuItem (triggered)="navigateToProfile()">
            <ng-icon hlm name="lucideUser" />
            <span>{{ p ? 'Profile' : 'Set up profile' }}</span>
          </button>
        }
        <button hlmDropdownMenuItem (triggered)="navigateToWallet()">
          <ng-icon hlm name="lucideWallet" />
          <span>Wallet</span>
          <hlm-dropdown-menu-shortcut class="font-mono tabular-nums tracking-normal">
            {{ walletBalance }}
          </hlm-dropdown-menu-shortcut>
        </button>
      </hlm-dropdown-menu-group>
    }
    <hlm-dropdown-menu-separator />
    <hlm-dropdown-menu-group>
      <button hlmDropdownMenuItem (triggered)="handleLogout()">
        <ng-icon hlm name="lucideLogOut" />
        <span>Logout</span>
      </button>
    </hlm-dropdown-menu-group>
  </hlm-dropdown-menu>
</ng-template>
