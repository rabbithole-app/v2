<hlm-dialog
  class="hidden"
  aria-labelledby="user-settings-dialog-title"
  [state]="dialogState()"
  (stateChanged)="handleDialogStateChanged($event)"
>
  <hlm-dialog-content
    *hlmDialogPortal
    [showCloseButton]="false"
    class="w-[min(94vw,760px)] gap-0 overflow-hidden border-0 p-0 outline-none focus:outline-none focus-visible:ring-0 sm:max-w-[760px]"
  >
    <button
      hlmBtn
      variant="ghost"
      size="icon-sm"
      type="button"
      class="absolute end-4 top-4"
      aria-label="Close account dialog"
      (click)="close()"
    >
      <ng-icon hlmIcon size="sm" name="lucideX" />
    </button>

    <section
      class="grid min-h-[420px] overflow-hidden md:grid-cols-[184px_minmax(0,1fr)]"
    >
      <hlm-sidebar
        collapsible="none"
        class="!h-full !min-h-0 !w-full border-b md:border-r md:border-b-0"
      >
        <div hlmSidebarContent>
          <div hlmSidebarGroup>
            <div hlmSidebarGroupLabel>Account</div>
            <div hlmSidebarGroupContent>
              <ul hlmSidebarMenu>
                <li hlmSidebarMenuItem>
                  <button
                    hlmSidebarMenuButton
                    type="button"
                    [isActive]="activeSection() === 'settings'"
                    (click)="selectSection('settings')"
                  >
                    <ng-icon name="lucideSettings" aria-hidden="true" />
                    <span>Settings</span>
                  </button>
                </li>
                <li hlmSidebarMenuItem>
                  <button
                    hlmSidebarMenuButton
                    type="button"
                    [isActive]="activeSection() === 'subscription'"
                    (click)="selectSection('subscription')"
                  >
                    <ng-icon name="lucideCreditCard" aria-hidden="true" />
                    <span>Subscription</span>
                  </button>
                </li>
                <li hlmSidebarMenuItem>
                  <button
                    hlmSidebarMenuButton
                    type="button"
                    [isActive]="activeSection() === 'wallet'"
                    (click)="selectSection('wallet')"
                  >
                    <ng-icon name="lucideWallet" aria-hidden="true" />
                    <span>Wallet</span>
                  </button>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </hlm-sidebar>

      <main class="flex min-w-0 flex-col overflow-hidden p-5">
        <hlm-dialog-header class="pr-8">
          <div class="flex min-w-0 items-center gap-2">
            @if (routeState().backCommands) {
              <button
                hlmBtn
                variant="ghost"
                size="icon"
                type="button"
                [attr.aria-label]="routeState().backLabel"
                (click)="handleHeaderBack()"
              >
                <ng-icon name="lucideArrowLeft" hlmIcon size="sm" />
              </button>
            }
            <h2 id="user-settings-dialog-title" hlmDialogTitle class="truncate">
              {{ routeState().title }}
            </h2>
            @if (routeState().walletRefresh) {
              <button
                hlmBtn
                variant="ghost"
                size="icon-sm"
                type="button"
                aria-label="Refresh wallet balances"
                (click)="refreshWallet()"
              >
                <ng-icon hlmIcon name="lucideRefreshCw" size="sm" />
              </button>
            }
          </div>
        </hlm-dialog-header>

        <div
          class="-mx-1 mt-5 flex min-h-0 flex-1 flex-col overflow-auto px-1 pb-1"
        >
          <router-outlet />
        </div>
      </main>
    </section>
  </hlm-dialog-content>
</hlm-dialog>
