@if (disabled()) {
<div hlmEmpty [class]="dropzoneComputedClass()">
  <ng-container [ngTemplateOutlet]="dropzoneContent" />
</div>
} @else {
<div
  hlmEmpty
  (dragenter)="handleDragEnter($any($event))"
  (dragleave)="handleDragLeave($any($event))"
  (dragover)="handleDragOver($any($event))"
  (drop)="handleDrop($any($event))"
  (click)="openFileDialog()"
  (keydown.enter)="openFileDialog()"
  (keydown.space)="openFileDialog()"
  [attr.data-dragging]="isDragging()"
  tabindex="0"
  role="button"
  aria-label="Upload files by clicking or dragging and dropping"
  [class]="dropzoneComputedClass()"
>
  <ng-container [ngTemplateOutlet]="dropzoneContent" />
</div>
}
<ng-template #dropzoneContent>
  <div hlmEmptyHeader>
    <div hlmEmptyMedia variant="icon">
      <ng-icon name="lucideFileUp" />
    </div>
    <div hlmEmptyTitle>Upload files</div>
    <div hlmEmptyDescription>Drag & drop files here or select them</div>
  </div>
  <div hlmEmptyContent>
    <div
      class="flex flex-wrap justify-center gap-2"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
      tabindex="-1"
    >
      <button hlmBtn (click)="openFileDialog()">
        <ng-icon hlm size="sm" name="lucideFileUp" />
        Select files
      </button>
      <ng-content select="[rbthCoreFileUploadDropzoneAction]" />
    </div>
  </div>
</ng-template>
