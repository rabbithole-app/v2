<div class="flex justify-between items-center">
  <h1 class="text-2xl font-semibold">Storage</h1>
  @if (canWrite()) {
    <rbth-feat-file-list-upload-drawer />
  }
</div>
@if (noAccess()) {
  <rbth-feat-file-list-no-access-empty
    [accessRequest]="accessRequest()"
    [cancelling]="accessRequestCancelling()"
    [refreshing]="accessRequestRefreshing()"
    [submitting]="accessRequestSubmitting()"
    (cancelAccessRequest)="_handleCancelAccessRequest($event)"
    (refreshAccessRequest)="_handleRefreshAccessRequest()"
    (reloadStorage)="_handleReloadAfterAccessApproved()"
    (requestAccess)="_handleRequestAccess()"
  />
} @else if (items().length === 0) {
  <div hlmEmpty class="min-h-[400px]" [hlmContextMenuTrigger]="emptyAreaContextMenu" [disabled]="!canWrite()">
    <div hlmEmptyHeader>
      <div hlmEmptyMedia variant="icon">
        <ng-icon name="lucideFolderOpen" />
      </div>
    </div>
    <div hlmEmptyTitle>No files or folders</div>
    <div hlmEmptyDescription>
      @if (canWrite()) {
        This directory is empty. Upload files or create folders to get started.
      } @else {
        This directory is empty.
      }
    </div>
  </div>
} @else {
  <rbth-feat-file-list-grid-view
    class="mt-4"
    [hlmContextMenuTrigger]="emptyAreaContextMenu"
    [disabled]="!canWrite()"
    [items]="items()"
    (color)="_handleColor($event)"
    (delete)="_handleDelete($event)"
    (download)="_handleDownload($event)"
    (manageAccess)="_handleManageAccess($event)"
    (makePublic)="_handleMakePublic($event)"
    (move)="_handleMove($event)"
    (rename)="_handleRename($event)"
    (properties)="_handleProperties($event)"
    (share)="_handleShare($event)"
    (selectionChange)="_handleSelectionChange($event)"
  />
}

<ng-template #emptyAreaContextMenu>
  @if (canWrite()) {
    <hlm-dropdown-menu class="w-52">
      <hlm-dropdown-menu-group>
        <button hlmDropdownMenuItem (click)="_handleNewFolder()">
          <ng-icon hlm name="lucideFolderPlus" hlmMenuIcon />
          New folder
        </button>
        <hlm-dropdown-menu-separator />
        <button hlmDropdownMenuItem (click)="fileListService.openFileDialog()">
          <ng-icon hlm name="lucideUpload" hlmMenuIcon />
          Upload files
        </button>
        <button
          hlmDropdownMenuItem
          (click)="fileListService.openDirectoryDialog()"
        >
          <ng-icon hlm name="lucideFolderUp" hlmMenuIcon />
          Upload directory
        </button>
      </hlm-dropdown-menu-group>
    </hlm-dropdown-menu>
  }
</ng-template>

<rbth-feat-properties-drawer [items]="propertiesDrawerItems()" />
<core-share-dialog
  [scopeLabel]="shareDialogScopeLabel()"
  [scopeKind]="shareDialogScopeKind()"
  [itemCount]="shareDialogItems().length"
  [accessList]="shareDialogItems().length === 1 ? shareAccessList() : []"
  [accessListLoading]="shareAccessListLoading()"
  (accessGrantsChange)="_handleShareAccessGrants($event)"
  (cancelPendingAccessGrant)="_handleShareCancelPendingAccessGrant($event)"
  (revokeAccessGrants)="_handleShareRevokeAccessGrants($event)"
/>
