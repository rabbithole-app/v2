<rbth-drawer side="right">
  <button id="edit-profile" variant="outline" brnSheetTrigger hlmBtn>
    <ng-icon hlmIcon size="sm" name="lucidePanelRightOpen" />
    Uploads
  </button>
  <rbth-drawer-content *brnSheetContent="let ctx">
    <rbth-drawer-header>
      <div class="flex min-w-0 flex-1 items-center gap-3">
        <h2 rbthDrawerTitle class="flex-none">Upload</h2>
        @if (showStorageSwitcher()) {
          <hlm-select
            rbthCoreTransparentSelectBackdrop
            [value]="selectedStorageId()"
            (valueChange)="selectStorage($any($event))"
          >
            <hlm-select-trigger class="w-[180px]">
              <hlm-select-value />
            </hlm-select-trigger>
            <hlm-select-content *hlmSelectPortal>
              @for (id of storagesWithUploads(); track id) {
                <hlm-select-item [value]="id">
                  {{ id.slice(0, 8) }}...
                </hlm-select-item>
              }
            </hlm-select-content>
          </hlm-select>
        }
      </div>
    </rbth-drawer-header>
    <div class="flex-1 overflow-y-auto space-y-6">
      <div class="px-4">
        <rbth-core-file-upload-dropzone (added)="upload($event)">
          <button
            rbthCoreFileUploadDropzoneAction
            hlmBtn
            variant="outline"
            (click)="fileListService.openDirectoryDialog()"
          >
            <ng-icon hlmIcon size="sm" name="lucideFolderUp" />
            Upload directory
          </button>
        </rbth-core-file-upload-dropzone>
      </div>
      @if (activeItems().length) {
        <h3 rbthDrawerSeparator>Active</h3>
        <rbth-core-upload-drawer-list [items]="activeItems()" />
      }
      @if (completedItems().length) {
        <h3 rbthDrawerSeparator>Completed</h3>
        <rbth-core-upload-drawer-list [items]="completedItems()" />
      }
      @if (failedItems().length) {
        <h3 rbthDrawerSeparator>Failed</h3>
        <rbth-core-upload-drawer-list [items]="failedItems()" />
      }
    </div>
  </rbth-drawer-content>
</rbth-drawer>
