<rbth-drawer side="right">
  <button id="edit-profile" variant="outline" brnSheetTrigger hlmBtn>
    Upload files
  </button>
  <rbth-drawer-content *brnSheetContent="let ctx">
    <rbth-drawer-header>
      <h2 rbthDrawerTitle>Upload</h2>
      @if (showStorageSwitcher()) {
        <hlm-select
          class="ml-auto"
          [value]="selectedStorageId()"
          (valueChange)="selectStorage($any($event))"
        >
          <hlm-select-trigger class="w-[180px]">
            <hlm-select-value />
          </hlm-select-trigger>
          <hlm-select-content>
            @for (id of storagesWithUploads(); track id) {
              <hlm-select-item [value]="id">
                {{ id.slice(0, 8) }}...
              </hlm-select-item>
            }
          </hlm-select-content>
        </hlm-select>
      }
    </rbth-drawer-header>
    <div class="flex-1 overflow-y-auto space-y-6">
      <div class="flex gap-2 px-4 pb-2">
        <button hlmBtn (click)="fileListService.openDirectoryDialog()">
          <ng-icon hlmIcon size="sm" name="lucideFolderUp" />
          Upload directory
        </button>
      </div>
      <core-file-upload-dropzone
        class="flex flex-col gap-2 w-full px-4"
        (added)="upload($event)"
      />
      @if (activeItems().length) {
        <h3 rbthDrawerSeparator>Active</h3>
        <core-upload-drawer-list [items]="activeItems()" />
      }
      @if (completedItems().length) {
        <h3 rbthDrawerSeparator>Completed</h3>
        <core-upload-drawer-list [items]="completedItems()" />
      }
      @if (failedItems().length) {
        <h3 rbthDrawerSeparator>Failed</h3>
        <core-upload-drawer-list [items]="failedItems()" />
      }
    </div>
  </rbth-drawer-content>
</rbth-drawer>
