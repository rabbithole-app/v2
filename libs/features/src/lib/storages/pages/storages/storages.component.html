<ng-template rbthCorePageHeaderActions>
  <div hlmButtonGroup>
    <button
      hlmBtn
      variant="outline"
      size="icon"
      [disabled]="isLoading()"
      (click)="refresh()"
    >
      @if (isLoading()) {
        <hlm-spinner size="xs" />
      } @else {
        <ng-icon hlmIcon name="lucideRefreshCw" size="sm" />
      }
    </button>
    <button
      hlmBtn
      variant="outline"
      [disabled]="isCreating() || hasActiveCreation()"
      [routerLink]="['/dashboard', { outlets: { dialog: 'create-storage' } }]"
    >
      <ng-icon hlmIcon name="lucidePlus" size="sm" />
      Create Vault
    </button>
  </div>
</ng-template>

<!-- Storages List -->
@if (storages().length > 0) {
  <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">
    @for (storage of storages(); track storage.id) {
      @defer (on viewport) {
        <rbth-feat-storages-storage-card [storage]="storage" />
      } @placeholder {
        <div class="min-h-[116px] rounded-lg border bg-card p-4">
          <div class="mb-4 flex items-center gap-3">
            <div class="size-10 rounded-md bg-muted"></div>
            <div class="min-w-0 flex-1 space-y-2">
              <div class="h-4 w-3/4 rounded bg-muted"></div>
              <div class="h-3 w-24 rounded bg-muted"></div>
            </div>
          </div>
          <div class="h-9 w-32 rounded-md bg-muted"></div>
        </div>
      }
    }
  </div>
} @else if (isLoading()) {
  <div hlmEmpty class="min-h-0 flex-1">
    <div hlmEmptyHeader>
      <div hlmEmptyMedia variant="icon">
        <hlm-spinner />
      </div>
      <div hlmEmptyTitle>Loading vaults</div>
      <div hlmEmptyDescription>
        Fetching your vaults from the backend...
      </div>
    </div>
  </div>
} @else {
  <div hlmEmpty class="min-h-0 flex-1">
    <div hlmEmptyHeader>
      <div hlmEmptyMedia variant="icon">
        <ng-icon name="lucideInbox" />
      </div>
      <div hlmEmptyTitle>No vaults found</div>
      <div hlmEmptyDescription>
        Create a new encrypted vault canister to get started.
      </div>
    </div>
  </div>
}
