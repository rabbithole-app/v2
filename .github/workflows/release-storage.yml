name: Release Storage

on:
  push:
    branches:
      - main
    paths:
      - 'apps/storage/**'
      - 'libs/encrypted-storage/**'
      - 'libs/motoko/encrypted-storage/**'
      - 'apps/backend/src/EncryptedStorageCanister.mo'
      - 'apps/backend/src/StorageDeployer/**'
      - 'apps/backend/src/Subscriptions/**'
      - 'apps/backend/src/KnownWasmHashes/**'
      - 'apps/backend/mock/**'
      - 'apps/backend/icp.yaml'
      - 'apps/backend/mops.toml'
      - 'apps/backend/mops.lock'
      - 'apps/backend/release-notes/**'
      - 'apps/backend/scripts/build-storage-release-manifest.mjs'
      - 'apps/backend/scripts/build-storage-release-wasm.sh'
      - 'mops-patches/**'
      - '.github/workflows/release-storage.yml'
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'How to publish the generated release.'
        required: true
        default: draft
        type: choice
        options:
          - draft
          - rc
          - stable
          - dry-run
      max_commits:
        description: 'Optional changelog commit limit.'
        required: false
        type: string
      release_notes_file:
        description: 'Optional Markdown or JSON release notes file. Defaults to apps/backend/release-notes/<tag>.md/.json when present.'
        required: false
        type: string

permissions:
  contents: write # Required to create releases

concurrency:
  group: storage-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Resolve release mode
        id: release_mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.release_mode || 'draft' }}"
          else
            mode="dry-run"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          case "$mode" in
            draft)
              echo "create_release=true" >> "$GITHUB_OUTPUT"
              echo "draft=true" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
            rc)
              echo "create_release=true" >> "$GITHUB_OUTPUT"
              echo "draft=false" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              ;;
            stable)
              echo "create_release=true" >> "$GITHUB_OUTPUT"
              echo "draft=false" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
            dry-run)
              echo "create_release=false" >> "$GITHUB_OUTPUT"
              echo "draft=true" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown release mode: $mode"
              exit 1
              ;;
          esac

      # Install dependencies
      - run: npm ci --legacy-peer-deps

      # Install backend dependencies (required for Nx graph processing)
      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci --legacy-peer-deps

      # Install icp-cli + Motoko build tools
      - name: Install ICP build tools
        run: npm install -g @icp-sdk/icp-cli@0.3.1 @icp-sdk/ic-wasm ic-mops@2.13.2

      # Build encrypted-storage JS library
      - name: Build encrypted-storage library
        run: npx nx build encrypted-storage

      # Build storage frontend
      - name: Build storage frontend
        run: npx nx build storage --configuration=production

      # Build EncryptedStorageCanister WASM
      - name: Build EncryptedStorageCanister WASM
        run: apps/backend/scripts/build-storage-release-wasm.sh --artifacts-dir release-artifacts

      # Calculate WASM SHA256 hash
      - name: Calculate WASM SHA256
        id: wasm_sha256
        run: |
          WASM_PATH="apps/backend/.icp/cache/artifacts/encrypted-storage"
          if [ -f "$WASM_PATH" ]; then
            SHA256=$(sha256sum "$WASM_PATH" | cut -d' ' -f1)
            echo "sha256=$SHA256" >> $GITHUB_OUTPUT
            echo "WASM SHA256: $SHA256"
          else
            echo "❌ WASM file not found at $WASM_PATH"
            exit 1
          fi

      # Create frontend tar archive (without gzip - saves cycles on canister decoding)
      - name: Create frontend tar archive
        run: |
          cd dist/apps/storage/browser
          tar -cf ../../../../storage-frontend.tar .
          cd ../../../../
          echo "✅ Created storage-frontend.tar"

      # Create JS library archive
      - name: Create library archive
        run: |
          cd dist/libs/encrypted-storage
          zip -r ../../../encrypted-storage-lib.zip .
          cd ../../../
          echo "✅ Created encrypted-storage-lib.zip"

      # Copy artifacts to single directory
      - name: Prepare release artifacts
        run: |
          mkdir -p release-artifacts
          cp apps/backend/.icp/cache/artifacts/encrypted-storage release-artifacts/encrypted-storage.wasm.gz
          cp storage-frontend.tar release-artifacts/
          cp encrypted-storage-lib.zip release-artifacts/

      # Create machine-readable release manifest and GitHub release body
      - name: Build storage release manifest
        id: manifest
        run: |
          args=(
            --artifacts-dir release-artifacts \
            --frontend-dir dist/apps/storage/browser \
            --output release-artifacts/storage-release.json \
            --release-body storage-release-body.md \
            --auto-version
          )

          if [ "${{ steps.release_mode.outputs.mode }}" = "rc" ]; then
            args+=(--prerelease rc)
          fi

          if [ -n "${{ inputs.max_commits || '' }}" ]; then
            args+=(--max-commits "${{ inputs.max_commits }}")
          fi

          if [ -n "${{ inputs.release_notes_file || '' }}" ]; then
            args+=(--release-notes "${{ inputs.release_notes_file }}")
          fi

          node apps/backend/scripts/build-storage-release-manifest.mjs "${args[@]}"

      # Create checksums.txt after manifest generation so it is included
      - name: Create checksums
        run: |
          cd release-artifacts
          sha256sum * > checksums.txt
          echo "✅ Prepared release artifacts"

      - name: Delete existing draft release
        if: steps.release_mode.outputs.create_release == 'true' && steps.release_mode.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.manifest.outputs.tag_name }}
        run: |
          is_draft="$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [ "$is_draft" = "true" ]; then
            gh release delete "$TAG_NAME" --yes
          fi

      - name: Write candidate summary
        if: steps.release_mode.outputs.create_release != 'true'
        run: cat storage-release-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate artifacts
        if: steps.release_mode.outputs.create_release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: storage-release-candidate-${{ github.sha }}
          path: release-artifacts/*
          if-no-files-found: error

      # Create GitHub Release
      - name: Create Release
        if: steps.release_mode.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          tag_name: ${{ steps.manifest.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.manifest.outputs.tag_name }}
          body_path: storage-release-body.md
          draft: ${{ steps.release_mode.outputs.draft }}
          prerelease: ${{ steps.release_mode.outputs.prerelease == 'true' || contains(steps.manifest.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
