name: Deploy Rabbithole

on:
  workflow_dispatch:
    inputs:
      target:
        description: Canisters to deploy
        required: true
        default: both
        type: choice
        options:
          - both
          - backend
          - frontend

permissions:
  contents: read

concurrency:
  group: rabbithole-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci --legacy-peer-deps

      - name: Install ICP build tools
        run: npm install -g @icp-sdk/icp-cli@1.0.0 @icp-sdk/ic-wasm ic-mops@2.14.1

      - name: Install didc
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/didc" https://github.com/dfinity/candid/releases/download/2025-12-18/didc-linux64
          chmod +x "$HOME/.local/bin/didc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Motoko dependencies
        working-directory: apps/backend
        run: |
          mops toolchain init || echo "Mops toolchain already initialized."
          mops install || echo "WARNING: mops install reported errors (integrity check?). Continuing..."
          ../../mops-patches/apply.sh .

      - name: Import ICP identity
        env:
          ICP_DEPLOY_IDENTITY_PEM: ${{ secrets.ICP_DEPLOY_IDENTITY_PEM }}
        run: |
          if [ -z "$ICP_DEPLOY_IDENTITY_PEM" ]; then
            echo "Missing ICP_DEPLOY_IDENTITY_PEM secret."
            exit 1
          fi

          identity_file="$(mktemp)"
          printf '%s' "$ICP_DEPLOY_IDENTITY_PEM" > "$identity_file"
          icp identity import --storage plaintext --from-pem "$identity_file" rabbithole-mainnet-deployer
          icp identity default rabbithole-mainnet-deployer
          rm -f "$identity_file"
          icp identity principal

      - name: Generate declarations and init args
        run: npx nx run backend:generate-declarations --skip-nx-cache --outputStyle=static

      # Guards against `RTS error: Memory-incompatible program upgrade`: the
      # deployed canister carries its stable-types signature in the
      # `motoko:stable-types` wasm section (private — readable because the
      # deploy identity is a controller). Compare it against the freshly
      # built wasm BEFORE install instead of trapping in post_upgrade.
      - name: Check stable-memory compatibility with deployed backend
        if: ${{ inputs.target == 'backend' || inputs.target == 'both' }}
        working-directory: apps/backend
        run: |
          icp build

          if ! icp canister metadata rabbithole-backend motoko:stable-types -e ic > deployed.most; then
            echo "No stable-types metadata on the deployed canister — skipping compatibility check."
            exit 0
          fi

          artifact=.icp/cache/artifacts/rabbithole-backend
          if gunzip -t "$artifact" 2>/dev/null; then
            gunzip -c "$artifact" > new.wasm
          else
            cp "$artifact" new.wasm
          fi
          ic-wasm new.wasm metadata motoko:stable-types > new.most

          moc_bin="$(mops toolchain bin moc)"
          if ! "$moc_bin" --stable-compatible deployed.most new.most; then
            echo "::error::rabbithole-backend WASM is memory-incompatible with the deployed canister — the upgrade would trap in post_upgrade. Freeze or migrate the offending stable type before deploying."
            exit 1
          fi
          echo "Stable memory layout is compatible with the deployed canister."

      - name: Deploy backend
        if: ${{ inputs.target == 'backend' || inputs.target == 'both' }}
        working-directory: apps/backend
        run: |
          icp deploy -e ic rabbithole-backend --mode auto --args-file ./init-args/rabbithole-backend.ic.bin --args-format hex --yes

      - name: Deploy frontend
        if: ${{ inputs.target == 'frontend' || inputs.target == 'both' }}
        working-directory: apps/backend
        run: |
          icp deploy -e ic rabbithole-frontend --mode auto --yes

      - name: Sync backend environment
        if: ${{ inputs.target == 'backend' || inputs.target == 'both' }}
        working-directory: apps/backend
        run: |
          bash scripts/sync-env.sh ic

      - name: Restore private backend release token and refresh releases
        if: ${{ (inputs.target == 'backend' || inputs.target == 'both') && github.event.repository.private }}
        working-directory: apps/backend
        env:
          STORAGE_RELEASES_GITHUB_TOKEN: ${{ secrets.STORAGE_RELEASES_GITHUB_TOKEN }}
        run: |
          if [ -z "$STORAGE_RELEASES_GITHUB_TOKEN" ]; then
            echo "Missing STORAGE_RELEASES_GITHUB_TOKEN secret for private release repository."
            exit 1
          fi

          icp canister settings update rabbithole-backend -e ic \
            --add-environment-variable "GITHUB_TOKEN=${STORAGE_RELEASES_GITHUB_TOKEN}" \
            -f

          icp canister call rabbithole-backend refreshStorageReleaseIndex '()' -e ic --output candid
