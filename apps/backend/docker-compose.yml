name: "rabbithole"

services:
  network:
    image: ghcr.io/dfinity/icp-cli-network-launcher:12.0.0-2026-04-16-04-20
    restart: unless-stopped
    command:
      - --nns
      - --subnet=application
      - --subnet=fiduciary
      - --state-dir=/app/state
    volumes:
      - ./.icp-state:/app/state
      - ./.icp-status:/app/status
    ports:
      - "8000:4943"
    expose:
      - 4943
      - 4942
    healthcheck:
      test: ["CMD", "test", "-f", "/app/status/status.json"]
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 60s

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      network:
        condition: service_healthy

  mock-server:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./mock/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./mock/assets:/usr/share/nginx/html/assets:ro
      - ./mock/api:/usr/share/nginx/html/api:ro
    expose:
      - 8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

volumes:
  caddy_data:
  caddy_config:
