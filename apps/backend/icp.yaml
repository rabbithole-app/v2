networks:
  - networks/local.yaml

environments:
  # encrypted-storage is a WASM template installed dynamically by
  # rabbithole-backend into per-user storage canisters — it is NOT deployed
  # standalone. It's listed in `canisters:` only so `icp build encrypted-storage`
  # produces the wasm + did artifacts.
  - name: local
    network: local
    canisters:
      - rabbithole-backend
      - rabbithole-frontend
      - internet_identity_backend
      - internet_identity_frontend
      - xrc
      - sol_rpc
      - evm_rpc

  - name: staging
    network: ic
    canisters:
      - rabbithole-backend
      - rabbithole-frontend
    settings:
      rabbithole-backend:
        environment_variables:
          THRESHOLD_KEY_NAME: 'test_key_1'
          GITHUB_API_URL: 'https://api.github.com'
          GITHUB_OWNER: 'rabbithole-app'
          GITHUB_REPO: 'v2'
          trusted_attribute_signers: 'rdmx6-jaaaa-aaaaa-aaadq-cai'
          # Staging frontend origin depends on the deployed canister ID; run scripts/sync-env.sh staging after deploy.
          STORAGE_LICENSE_INCLUDED_BYTES: '2147483648' #2gb
          STORAGE_LICENSE_MAX_FILE_BYTES: '524288000' #500mb
          PUBLIC_BLOB_STORAGE_CASHIER_CANISTER_ID: '72ch2-fiaaa-aaaar-qbsvq-cai'
          CAFFFEINE_STORAGE_CASHIER_PRINCIPAL: '72ch2-fiaaa-aaaar-qbsvq-cai'
      rabbithole-frontend:
        environment_variables:
          PUBLIC_ENV_NAME: 'STAGING'
          PUBLIC_HTTP_AGENT_HOST: 'https://icp-api.io'
          PUBLIC_EVM_RPC_URL: 'https://sepolia.base.org'
          PUBLIC_SOL_RPC_URL: 'https://api.devnet.solana.com'
          PUBLIC_BLOB_STORAGE_GATEWAY_URL: 'https://blob.caffeine.ai'
          PUBLIC_BLOB_STORAGE_CASHIER_CANISTER_ID: '72ch2-fiaaa-aaaar-qbsvq-cai'
          PUBLIC_ICPAY_PUBLISHABLE_KEY: 'pk_GP6RSrfGQTRWxw2QeBXThqOGuYcPak3E'
          PUBLIC_ICPAY_API_URL: 'https://api.betterstripe.com'

  - name: ic
    network: ic
    canisters:
      - rabbithole-backend
      - rabbithole-frontend
    settings:
      rabbithole-backend:
        environment_variables:
          THRESHOLD_KEY_NAME: 'test_key_1'
          GITHUB_API_URL: 'https://api.github.com'
          GITHUB_OWNER: 'rabbithole-app'
          GITHUB_REPO: 'v2'
          trusted_attribute_signers: 'rdmx6-jaaaa-aaaaa-aaadq-cai'
          frontend_origins: 'https://rabbithole.app'
          STORAGE_LICENSE_INCLUDED_BYTES: '5368709120' #5gb
          STORAGE_LICENSE_MAX_FILE_BYTES: '2147483648' #2gb
          PUBLIC_BLOB_STORAGE_CASHIER_CANISTER_ID: '72ch2-fiaaa-aaaar-qbsvq-cai'
          CAFFFEINE_STORAGE_CASHIER_PRINCIPAL: '72ch2-fiaaa-aaaar-qbsvq-cai'
      rabbithole-frontend:
        environment_variables:
          PUBLIC_ENV_NAME: 'PROD'
          PUBLIC_HTTP_AGENT_HOST: 'https://icp-api.io'
          PUBLIC_EVM_RPC_URL: 'https://mainnet.base.org'
          PUBLIC_SOL_RPC_URL: 'https://api.mainnet-beta.solana.com'
          PUBLIC_BLOB_STORAGE_GATEWAY_URL: 'https://blob.caffeine.ai'
          PUBLIC_BLOB_STORAGE_CASHIER_CANISTER_ID: '72ch2-fiaaa-aaaar-qbsvq-cai'
          PUBLIC_ICPAY_PUBLISHABLE_KEY: ''
          PUBLIC_ICPAY_API_URL: 'https://api.icpay.org'

  # Build-only environment для encrypted-storage (никуда не деплоится,
  # wasm копируется в mock/assets/ через generate-mock-assets target)
  - name: build
    network: local
    canisters:
      - encrypted-storage

canisters:
  - name: rabbithole-backend
    recipe:
      type: '@dfinity/motoko@v4.1.0'
      configuration:
        main: src/main.mo
        compress: true
    init_args:
      path: ./init-args/rabbithole-backend.bin
      format: hex
    settings:
      environment_variables:
        THRESHOLD_KEY_NAME: 'key_1'
        GITHUB_API_URL: 'http://mock-server:8080'
        GITHUB_OWNER: 'user'
        GITHUB_REPO: 'repo'
        # Local development starts new storage canisters from the committed
        # mock baseline. Local dev releases remain available as upgrade targets.
        STORAGE_INSTALL_RELEASE_TAG: 'storage-v0.1.0'
        STORAGE_UPDATE_RELEASE_SELECTOR: 'latest-prerelease'
        STORAGE_LICENSE_INCLUDED_BYTES: '1073741824' #1gb
        STORAGE_LICENSE_MAX_FILE_BYTES: '104857600' #100mb
        STORAGE_FRONTEND_ORIGINS: 'http://localhost:4201'
        # Local II backend canister ID is dynamic; run scripts/sync-env.sh local after raw icp deploy.
        frontend_origins: 'http://localhost:4200'
        PUBLIC_BLOB_STORAGE_CASHIER_CANISTER_ID: 'xc7sj-uyaaa-aaaaf-qbrja-cai'
        CAFFFEINE_STORAGE_CASHIER_PRINCIPAL: 'xc7sj-uyaaa-aaaaf-qbrja-cai'

  - name: encrypted-storage
    recipe:
      type: '@dfinity/motoko@v4.1.0'
      configuration:
        main: src/EncryptedStorageCanister.mo
        args: --max-stable-pages 3276800
        compress: true

  - name: rabbithole-frontend
    recipe:
      type: '@dfinity/asset-canister@v2.1.0'
      configuration:
        dir: ../../dist/apps/rabbithole/browser
        build:
          - sh -c 'cd ../.. && npx nx build rabbithole'
    settings:
      environment_variables:
        PUBLIC_ENV_NAME: 'DEV'
        PUBLIC_HTTP_AGENT_HOST: 'https://localhost'
        PUBLIC_EVM_RPC_URL: 'https://sepolia.base.org'
        PUBLIC_SOL_RPC_URL: 'https://api.devnet.solana.com'
        PUBLIC_BLOB_STORAGE_GATEWAY_URL: 'https://blob.caffeine.ai'
        PUBLIC_BLOB_STORAGE_CASHIER_CANISTER_ID: 'xc7sj-uyaaa-aaaaf-qbrja-cai'
        PUBLIC_ICPAY_PUBLISHABLE_KEY: 'pk_GP6RSrfGQTRWxw2QeBXThqOGuYcPak3E'
        PUBLIC_ICPAY_API_URL: 'https://api.betterstripe.com'

  - name: internet_identity_backend
    build:
      steps:
        - type: pre-built
          url: https://github.com/dfinity/internet-identity/releases/download/release-2026-05-26-be/internet_identity_backend.wasm.gz
    # Source Candid is kept in init-args/internet_identity_backend.did.
    # The hex file is didc-encoded with II's init type because icp-cli infers
    # untyped nested OpenID records incorrectly.
    init_args:
      path: ./init-args/internet_identity_backend.hex
      format: hex

  - name: internet_identity_frontend
    build:
      steps:
        - type: pre-built
          url: https://github.com/dfinity/internet-identity/releases/download/release-2026-05-26-be/internet_identity_frontend.wasm.gz
    init_args:
      path: ./init-args/internet_identity_frontend.did
      format: candid

  - name: xrc
    build:
      steps:
        - type: pre-built
          url: https://github.com/dfinity/exchange-rate-canister/releases/download/2026.06.05/xrc.wasm.gz
    init_args: '(null)'

  - name: sol_rpc
    build:
      steps:
        - type: pre-built
          url: https://github.com/dfinity/sol-rpc-canister/releases/download/sol_rpc_canister-v1.3.0/sol_rpc_canister.wasm.gz
    init_args: '(record {})'

  - name: evm_rpc
    build:
      steps:
        - type: pre-built
          url: https://github.com/dfinity/evm-rpc-canister/releases/download/evm_rpc-v2.8.0/evm_rpc.wasm.gz
    init_args: '(record {})'
