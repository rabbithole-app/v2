[package]
name = "rabbithole"
version = "0.2.0"
description = "Rabbithole App"
authors = ["khalik.faradzhli"]
edition = "2021"

[lib]
name = "rabbithole_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.10.2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "2.4.7"
tauri-plugin-store = "2.4.2"
tauri-plugin-opener = "2.5.3"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-window-state = "2.4.1"

# IC Agent & Auth
ic-agent = { version = "0.45", features = ["pem"] }
candid = "0.10"

# VetKeys crypto
ic-vetkeys = "0.6"

# General crypto
sha2 = "0.10"
rand = "0.8"

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# HTTP client
reqwest = { version = "0.12", features = ["rustls-tls"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Environment
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# MIME type detection
mime_guess = "2"

hex = "0.4"
ed25519-dalek = "2"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
ic-auth-client = { version = "0.5.0-beta.0", default-features = false, features = ["native", "keyring", "pem"] }
keyring = "3"
tauri-plugin-single-instance = { version = "2.4.0", features = ["deep-link"] }
